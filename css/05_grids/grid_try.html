<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="grid_try.css">
</head>
<body>
    <div class="container" style="display:grid; grid-template-columns: repeat(3, 1fr); height: 100vh; gap: 10px;">
        <div class="item" style="grid-column:1/3;">1</div>
        <div class="item">2</div>
        <div class="item" style="grid-column:1/2;">3</div>
        <div class="item" style="grid-column:2/4;">4</div>
        <div class="item" style="grid-column:1/3;">5</div>
        <div class="item">6</div>
    </div>
</body>
</html>
