<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login Page</title>
    <style>
      body {
        font-family: Arial, Helvetica, sans-serif;
        background-color: #1a1a1a;
        margin: 0;
        padding: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        background-color: #beb6b6;
        border-radius: 7px;
        padding: 25px;
        width: 300px;
      }
      h2 {
        color: blue;
        text-align: center;
        font-size: 30px;
        margin-bottom: 40px;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 15px;
      }
      input {
        padding: 7px;
        border-radius: 7px;
        background-color: #d8d3d3;
        border: 2px solid black;
      }
      button {
        border-radius: 4px;
        background-color: rgb(22, 78, 17);
        color: white;
        padding: 8px;
      }
      button:hover {
        background-color: #138e3a;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h2>FACEBOOK</h2>
      <form>
        <input type="text" name="Username" placeholder="USERNAME" />

        <input type="password" name="Password" placeholder="PASSWORD" />
        <button type="submit">LOGIN</button>
      </form>
    </div>
  </body>
</html>
